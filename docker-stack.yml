# Single stack file targeting both local Swarm and a single-node Swarm in production.
# Ingress: cloudflared runs on the host (outside this stack) and proxies the tunnel
# to http://localhost:${APP_PORT}.
# Environment-driven knobs:
#   TAG                    image tag (default "latest")
#   ASPNETCORE_ENVIRONMENT "Development" or "Production"
#   EMAIL_PROVIDER         "smtp4dev" (dev) or "smtp"/"resend" (prod)
#   APP_PORT               host port for the app; 8080 in dev and prod (the host-run
#                          cloudflared points its tunnel route at localhost:8080).
#   LOCAL_SMTP4DEV_PORT    dev only; e.g. 8025. Leave 0 in prod.
#   SMTP4DEV_REPLICAS      1 in dev, 0 in prod.
#
# Required secrets (created with `docker secret create`). Names are prefixed so they
# stay distinguishable on a shared Swarm hosting other stacks; the app mounts them at
# the short in-container paths via source/target:
#   blazortodo_db_password, blazortodo_admin_password
#   blazortodo_resend_api_key (only meaningful in prod with EMAIL_PROVIDER=resend)

services:
  app:
    image: blazortodo:${TAG:-latest}
    networks: [internal]
    secrets:
      - source: blazortodo_db_password
        target: db_password
      - source: blazortodo_resend_api_key
        target: resend_api_key
      - source: blazortodo_admin_password
        target: admin_password
    volumes:
      # Persists the Data Protection key ring so auth cookies + antiforgery tokens survive
      # container restarts/redeploys. Path matches DataProtection__KeysDirectory below.
      - dataprotection_keys:/keys
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      DisableHttpsRedirect: "true"
      DataProtection__KeysDirectory: /keys
      # Restrict to the real public hostname(s) to block Host-header injection (poisoned
      # links in confirmation/reset emails). Set at deploy time via APP_ALLOWED_HOSTS, e.g.
      # "todo.example.com" (comma-separate multiples). deploy-prod.sh *requires* it; the
      # "*" fallback here only applies to the local-swarm dev path (deploy-local.sh).
      AllowedHosts: ${APP_ALLOWED_HOSTS:-*}
      # The connection string is composed at runtime by the app from these parts; the
      # password file is mounted under /run/secrets. The simplest path is to inject
      # the full string here with the password inlined from the secret at deploy time.
      # For now we rely on the secret being readable by the app (volume-mounted) and
      # have the connection string reference it as a file via the Npgsql `Passfile`
      # option, or read it in Program.cs at startup. We default to the env-injected
      # full string for dev simplicity; prod operators can swap to Passfile.
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=todolist;Username=todolist;Password=${POSTGRES_PASSWORD:-dev-password}"
      Email__Provider: ${EMAIL_PROVIDER:-smtp}
      Email__Smtp__Host: ${EMAIL_SMTP_HOST:-smtp4dev}
      Email__Smtp__Port: ${EMAIL_SMTP_PORT:-1025}
      # SMTP auth for a real relay (e.g. Resend: username "resend", password = API key).
      # Left empty for dev/smtp4dev, where no username means credentials are skipped.
      # Port 587 + EnableSsl=true = STARTTLS (the only TLS mode SmtpClient supports).
      Email__Smtp__Username: ${EMAIL_SMTP_USERNAME:-}
      Email__Smtp__Password: ${EMAIL_SMTP_PASSWORD:-}
      Email__Smtp__EnableSsl: ${EMAIL_SMTP_ENABLE_SSL:-false}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-noreply@blazortodo.local}
      Email__FromName: ${EMAIL_FROM_NAME:-BlazorTodo}
      # Bootstrap admin account seeded at startup (see DatabaseInitializer). The password is read
      # from the blazortodo_admin_password Docker secret (mounted at /run/secrets/admin_password);
      # email/display name come from deploy-time env vars.
      # Leave ADMIN_EMAIL empty to skip seeding.
      AdminUser__Email: ${ADMIN_EMAIL:-}
      AdminUser__DisplayName: ${ADMIN_DISPLAY_NAME:-Administrator}
      AdminUser__PasswordFile: /run/secrets/admin_password
    ports:
      - target: 8080
        published: ${APP_PORT:-0}
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
      resources:
        limits:
          memory: 512M

  postgres:
    image: postgres:18-alpine
    networks: [internal]
    secrets:
      - source: blazortodo_db_password
        target: db_password
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: todolist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql
    deploy:
      placement:
        constraints:
          - node.role == manager

  smtp4dev:
    image: rnwood/smtp4dev:v3
    networks: [internal]
    environment:
      # SMTP on 1025 so the app's Email__Smtp__Port default (1025) reaches it over the
      # overlay network. The web UI stays on smtp4dev's default container port 80 and is
      # published to the host below (ServerOptions__Urls does not relocate the web listener).
      ServerOptions__Port: 1025
      ServerOptions__HostName: smtp4dev
    ports:
      - target: 80
        published: ${LOCAL_SMTP4DEV_PORT:-0}
        protocol: tcp
        mode: host
    deploy:
      replicas: ${SMTP4DEV_REPLICAS:-0}

networks:
  internal:
    driver: overlay
    attachable: false

volumes:
  postgres_data: {}
  dataprotection_keys: {}

secrets:
  blazortodo_db_password:
    external: true
  blazortodo_resend_api_key:
    external: true
  blazortodo_admin_password:
    external: true
