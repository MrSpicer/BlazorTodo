services:
  postgres:
    image: postgres:17-alpine
    container_name: blazortodo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: todolist
      POSTGRES_USER: todolist
      POSTGRES_PASSWORD: dev-password
    volumes:
      - blazortodo_pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todolist -d todolist"]
      interval: 10s
      timeout: 5s
      retries: 5

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: blazortodo-smtp4dev
    ports:
      - "1025:1025"   # SMTP  (host 1025 -> smtp4dev SMTP on 1025)
      - "8025:80"     # Web UI (host 8025 -> smtp4dev web on 80)
    environment:
      - ServerOptions__Port=1025
      - ServerOptions__HostName=smtp4dev
    restart: unless-stopped

volumes:
  blazortodo_pg_data:
